<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>تتبع الإجازة - النيل للسكر</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;900&family=IBM+Plex+Sans+Arabic:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#2B2118;
    --paper:#F5F3EF;
    --card:#FFFFFF;
    --line:#E1DBCD;
    --amber:#B99A5B;
    --amber-deep:#8A6D34;
    --sage:#3F4A5C;
    --danger:#9C3B2E;
    --muted:#6E6759;
    --ok:#3D6B4F;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:
      radial-gradient(1100px 460px at 50% -180px, rgba(185,154,91,.10), transparent 65%),
      var(--paper);
    font-family:'IBM Plex Sans Arabic','Tajawal',sans-serif;
    color:var(--ink);
    min-height:100vh;
    padding:40px 16px 64px;
  }
  .wrap{max-width:640px;margin:0 auto;}

  .stamp{display:flex;align-items:center;margin-bottom:32px;flex-direction:row-reverse;justify-content:space-between;flex-wrap:nowrap;}
  .stamp-text .eyebrow{
    font-size:12px;letter-spacing:.14em;color:var(--amber-deep);
    text-transform:uppercase;margin-bottom:3px;font-weight:700;
  }
  h1{
    font-family:'Tajawal',sans-serif;font-weight:900;
    font-size:clamp(22px,4vw,28px);margin:0;color:var(--ink);
  }
  .stamp-text .sub{
    font-size:13px;color:var(--muted);margin-top:3px;
  }

  .card{
    background:var(--card);border:1px solid var(--line);border-radius:10px;
    padding:32px clamp(20px,4vw,40px);
    box-shadow:0 1px 2px rgba(43,33,24,.04), 0 12px 32px -12px rgba(43,33,24,.16);
    position:relative;
    margin-bottom:22px;
  }
  .card::before{
    content:"";position:absolute;top:0;right:0;left:0;height:5px;
    background:linear-gradient(90deg,var(--amber),var(--sage));
    border-radius:10px 10px 0 0;
  }

  .section-title{
    display:flex;align-items:center;gap:10px;
    margin:0 0 16px;
  }
  .section-title span{
    font-size:14px;font-weight:700;color:var(--amber-deep);
    letter-spacing:.02em;white-space:nowrap;
  }
  .section-title::after{
    content:"";flex:1;height:1px;background:var(--line);
  }

  .field{margin-bottom:16px;}
  label{display:block;font-size:14px;font-weight:600;margin:0 0 6px;color:var(--ink);}

  input[type=text]{
    width:100%;border:1px solid var(--line);background:#FAF8F4;
    border-radius:6px;padding:11px 13px;font-family:inherit;font-size:15px;
    color:var(--ink);transition:border-color .15s, background .15s, box-shadow .15s;
  }
  input:hover{border-color:#CFC7B2;}
  input:focus{
    outline:none;border-color:var(--amber);background:#fff;
    box-shadow:0 0 0 3px rgba(198,138,46,.15);
  }

  .code-status{
    font-size:12.5px;margin-top:6px;min-height:16px;
    display:flex;align-items:center;gap:6px;
  }
  .code-status.ok{color:var(--ok);font-weight:600;}
  .code-status.err{color:var(--danger);font-weight:600;}

  button{
    width:100%;background:linear-gradient(180deg,#332619,var(--ink));color:#fff;border:none;
    padding:14px 34px;font-size:15.5px;font-weight:700;
    border-radius:6px;cursor:pointer;font-family:inherit;
    box-shadow:0 6px 16px -6px rgba(43,33,24,.45);
    transition:background .15s, transform .1s, opacity .15s, box-shadow .15s;
  }
  button:hover{background:linear-gradient(180deg,#3E2E1D,#1A130C);box-shadow:0 8px 20px -6px rgba(43,33,24,.55);}
  button:active{transform:translateY(1px);}
  button:disabled{opacity:.5;cursor:not-allowed;box-shadow:none;}

  .hidden{display:none !important;}

  /* بطاقات الرصيد */
  .balance-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;}
  @media (max-width:480px){.balance-grid{grid-template-columns:1fr;}}
  .balance-box{
    background:#FAF8F4;border:1px solid var(--line);border-radius:8px;
    padding:16px 12px;text-align:center;
  }
  .balance-box .num{font-family:'Tajawal',sans-serif;font-weight:900;font-size:26px;color:var(--amber-deep);}
  .balance-box .lbl{font-size:12.5px;color:var(--muted);margin-top:4px;}
  .no-balance{font-size:13.5px;color:var(--muted);text-align:center;padding:10px 0;}

  /* جدول الطلبات */
  .req-list{display:flex;flex-direction:column;gap:10px;}
  .req-item{
    border:1px solid var(--line);border-radius:8px;padding:14px 16px;background:#FAF8F4;
  }
  .req-top{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:8px;flex-wrap:wrap;}
  .req-type{font-weight:700;font-size:14.5px;color:var(--ink);}
  .badge{
    display:inline-flex;align-items:center;gap:6px;
    font-size:12.5px;font-weight:700;padding:5px 12px;border-radius:20px;
    white-space:nowrap;
  }
  .badge.pending{background:#FBF1D8;color:#8A6D34;}
  .badge.approved{background:#E5EFE7;color:#3D6B4F;}
  .badge.rejected{background:#F5E4E1;color:#9C3B2E;}
  .req-details{font-size:13px;color:var(--muted);line-height:1.9;}
  .req-details b{color:var(--ink);font-weight:600;}
  .empty-note{font-size:13.5px;color:var(--muted);text-align:center;padding:14px 0;}

  /* جدول الإجازة المرضية / الاسترداد النقدي */
  table.sick-table{width:100%;border-collapse:collapse;font-size:13.5px;}
  table.sick-table th, table.sick-table td{
    border:1px solid var(--line);padding:9px 10px;text-align:center;
  }
  table.sick-table th{background:#FAF8F4;color:var(--muted);font-weight:700;font-size:12.5px;}

  .footer-note{text-align:center;margin-top:22px;font-size:12.5px;color:var(--muted);}
  ::placeholder{color:#A69F8D;}
  .spinner-note{text-align:center;color:var(--muted);font-size:13.5px;padding:8px 0;}
</style>
</head>
<body>
<div class="wrap">

  <div class="stamp">
    <div class="stamp-text">
      <div class="eyebrow">النيل للسكر</div>
      <h1>تتبع طلب الإجازة</h1>
      <div class="sub">استعلم عن حالة طلباتك ورصيد إجازاتك</div>
    </div>
  </div>

  <!-- بطاقة تسجيل الدخول -->
  <div class="card" id="loginCard">
    <div class="field code-row">
      <label>الكود الوظيفي</label>
      <input type="text" id="codeInput" inputmode="numeric" placeholder="اكتب كودك الوظيفي" autocomplete="off">
    </div>
    <div class="field code-row">
      <label>الرقم السري</label>
      <input type="text" id="pinInput" inputmode="numeric" maxlength="4" placeholder="الرقم السري الخاص بك (4 أرقام)" autocomplete="off">
      <div class="code-status" id="pinStatus"></div>
    </div>
    <button id="checkBtn" disabled>عرض بياناتي</button>
  </div>

  <!-- بطاقة الرصيد -->
  <div class="card hidden" id="balanceCard">
    <div class="section-title"><span>رصيد الإجازات</span></div>
    <div id="balanceContent"></div>
  </div>

  <!-- بطاقة الطلبات -->
  <div class="card hidden" id="requestsCard">
    <div class="section-title"><span>طلبات الإجازة</span></div>
    <div class="req-list" id="requestsList"></div>
  </div>

  <!-- بطاقة الإجازة المرضية / الاسترداد النقدي -->
  <div class="card hidden" id="sickCard">
    <div class="section-title"><span>الإجازة المرضية والاسترداد النقدي</span></div>
    <div id="sickContent"></div>
  </div>

  <p class="footer-note">بياناتك محمية بالرقم السري الخاص بك ولا تظهر لأي شخص آخر.</p>
</div>

<script>
  // رابط نفس الـ Apps Script المستخدم في نموذج طلب الإجازة (استبدله برابط الـ /exec الحالي)
  const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbwxDX3sXci4CvJpy_wO8KhCtEdnowLC36zolawQP1DFe0gDC0rNJdE_uTqbpLi9KQAW/exec';

  const codeInput = document.getElementById('codeInput');
  const pinInput = document.getElementById('pinInput');
  const pinStatus = document.getElementById('pinStatus');
  const checkBtn = document.getElementById('checkBtn');

  const balanceCard = document.getElementById('balanceCard');
  const balanceContent = document.getElementById('balanceContent');
  const requestsCard = document.getElementById('requestsCard');
  const requestsList = document.getElementById('requestsList');
  const sickCard = document.getElementById('sickCard');
  const sickContent = document.getElementById('sickContent');

  function updateBtn(){
    const code = codeInput.value.trim();
    const pin = pinInput.value.trim();
    checkBtn.disabled = !(code && pin.length === 4);
  }
  codeInput.addEventListener('input', updateBtn);
  pinInput.addEventListener('input', updateBtn);

  function statusBadge(status){
    if(status === 'تمت الموافقة'){
      return '<span class="badge approved">🟢 موافقة، وفي انتظار توقيع الموظف</span>';
    }
    if(status === 'مرفوض'){
      return '<span class="badge rejected">🔴 مرفوض</span>';
    }
    return '<span class="badge pending">🟡 قيد الانتظار</span>';
  }

  function renderBalance(balance){
    if(!balance){
      balanceContent.innerHTML = '<div class="no-balance">بيانات الرصيد غير متاحة حاليًا لقسمك، سيتم إضافتها قريبًا.</div>';
      return;
    }
    balanceContent.innerHTML =
      '<div class="balance-grid">' +
        '<div class="balance-box"><div class="num">' + balance.annual + '</div><div class="lbl">الرصيد السنوي</div></div>' +
        '<div class="balance-box"><div class="num">' + balance.restAllowance + '</div><div class="lbl">بدل الراحات الأسبوعية</div></div>' +
        '<div class="balance-box"><div class="num">' + balance.holidayWork + '</div><div class="lbl">بدل العمل في عطلة رسمية</div></div>' +
      '</div>';
  }

  function renderRequests(requests){
    if(!requests || requests.length === 0){
      requestsList.innerHTML = '<div class="empty-note">لا توجد طلبات إجازة مسجّلة باسمك حتى الآن.</div>';
      return;
    }
    requestsList.innerHTML = requests.map(function(r){
      return '<div class="req-item">' +
        '<div class="req-top"><span class="req-type">' + (r.leaveType || 'إجازة') + '</span>' + statusBadge(r.status) + '</div>' +
        '<div class="req-details">' +
          '<b>القسم:</b> ' + (r.deptLabel || '-') + '<br>' +
          '<b>من:</b> ' + (r.startDate || '-') + ' &nbsp; <b>إلى:</b> ' + (r.endDate || '-') + ' &nbsp; <b>عدد الأيام:</b> ' + (r.days || '-') + '<br>' +
          '<b>تاريخ التقديم:</b> ' + (r.submittedAt || '-') +
        '</div>' +
      '</div>';
    }).join('');
  }

  function renderSickCash(records){
    if(!records || records.length === 0){
      sickContent.innerHTML = '<div class="empty-note">لا توجد سجلات إجازة مرضية أو استرداد نقدي مسجّلة باسمك.</div>';
      return;
    }
    let rows = records.map(function(r){
      return '<tr><td>' + (r.type || '-') + '</td><td>' + (r.date || '-') + '</td><td>' + (r.details || '-') + '</td><td>' + (r.notes || '-') + '</td></tr>';
    }).join('');
    sickContent.innerHTML =
      '<table class="sick-table"><thead><tr><th>النوع</th><th>التاريخ</th><th>التفاصيل</th><th>ملاحظات</th></tr></thead><tbody>' + rows + '</tbody></table>';
  }

  async function fetchStatus(){
    const code = codeInput.value.trim();
    const pin = pinInput.value.trim();
    checkBtn.disabled = true;
    checkBtn.textContent = 'جارٍ التحميل...';
    pinStatus.textContent = '';
    pinStatus.className = 'code-status';

    try{
      const url = SCRIPT_URL + '?action=myStatus&code=' + encodeURIComponent(code) + '&pin=' + encodeURIComponent(pin);
      const res = await fetch(url);
      const data = await res.json();

      if(!data.valid){
        pinStatus.textContent = 'الكود الوظيفي أو الرقم السري غير صحيح ✕';
        pinStatus.className = 'code-status err';
        balanceCard.classList.add('hidden');
        requestsCard.classList.add('hidden');
        sickCard.classList.add('hidden');
        return;
      }

      pinStatus.textContent = '';
      renderBalance(data.balance);
      renderRequests(data.requests);
      renderSickCash(data.sickCash);
      balanceCard.classList.remove('hidden');
      requestsCard.classList.remove('hidden');
      sickCard.classList.remove('hidden');
    } catch(err){
      pinStatus.textContent = 'تعذّر التحميل، تأكد من الاتصال بالإنترنت وحاول مرة أخرى';
      pinStatus.className = 'code-status err';
    } finally {
      checkBtn.disabled = false;
      checkBtn.textContent = 'عرض بياناتي';
      updateBtn();
    }
  }

  checkBtn.addEventListener('click', fetchStatus);
</script>
</body>
</html>
