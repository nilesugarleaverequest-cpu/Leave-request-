<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>نموذج طلب إجازة - الصحة والسلامة</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;900&family=IBM+Plex+Sans+Arabic:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#2B2118;
    --paper:#F5F3EF;
    --card:#FFFFFF;
    --line:#E1DBCD;
    --amber:#B99A5B;
    --amber-deep:#8A6D34;
    --sage:#3F4A5C;
    --danger:#9C3B2E;
    --muted:#6E6759;
    --ok:#3D6B4F;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--paper);
    font-family:'IBM Plex Sans Arabic','Tajawal',sans-serif;
    color:var(--ink);
    min-height:100vh;
    padding:32px 16px 64px;
  }
  .wrap{max-width:640px;margin:0 auto;}

  .stamp{display:flex;align-items:center;gap:14px;margin-bottom:28px;}
  .stamp-mark{
    width:56px;height:56px;border-radius:50%;
    border:2.5px solid var(--amber);
    display:flex;align-items:center;justify-content:center;
    background:#fff;
    overflow:hidden;
    flex-shrink:0;
  }
  .stamp-mark img{
    width:100%;height:100%;object-fit:contain;padding:6px;
  }
  .stamp-text .eyebrow{
    font-size:12px;letter-spacing:.12em;color:var(--muted);
    text-transform:uppercase;margin-bottom:2px;
  }
  h1{
    font-family:'Tajawal',sans-serif;font-weight:900;
    font-size:clamp(24px,4vw,30px);margin:0;color:var(--ink);
  }

  .card{
    background:var(--card);border:1px solid var(--line);border-radius:4px;
    padding:36px clamp(20px,4vw,44px);box-shadow:0 1px 0 var(--line);
    position:relative;
  }
  .card::before{
    content:"";position:absolute;top:0;right:0;left:0;height:5px;
    background:linear-gradient(90deg,var(--amber),var(--sage));
    border-radius:4px 4px 0 0;
  }

  .field{margin-bottom:18px;}
  label{display:block;font-size:14px;font-weight:600;margin:0 0 6px;color:var(--ink);}
  label .req{color:var(--danger);margin-left:3px;}
  label .opt{color:var(--muted);font-weight:400;font-size:12.5px;}

  input[type=text],input[type=date],select,textarea{
    width:100%;border:1px solid var(--line);background:#FAF8F4;
    border-radius:3px;padding:11px 13px;font-family:inherit;font-size:15px;
    color:var(--ink);transition:border-color .15s, background .15s;
  }
  input:focus,select:focus,textarea:focus{
    outline:none;border-color:var(--amber);background:#fff;
    box-shadow:0 0 0 3px rgba(198,138,46,.15);
  }
  textarea{resize:vertical;min-height:76px;}
  input:read-only{background:#EFEBE1;color:var(--muted);}

  .code-row{position:relative;}
  .code-status{
    font-size:12.5px;margin-top:6px;min-height:16px;
    display:flex;align-items:center;gap:6px;
  }
  .code-status.ok{color:var(--ok);font-weight:600;}
  .code-status.err{color:var(--danger);font-weight:600;}
  .dot{width:6px;height:6px;border-radius:50%;background:currentColor;flex-shrink:0;}

  .row{display:grid;grid-template-columns:1fr 1fr;gap:16px;}
  @media (max-width:520px){.row{grid-template-columns:1fr;}}

  .date-select{display:grid;grid-template-columns:1fr 1.4fr 1fr;gap:8px;}
  .date-select select{
    width:100%;border:1px solid var(--line);background:#FAF8F4;
    border-radius:3px;padding:11px 8px;font-family:inherit;font-size:14.5px;
    color:var(--ink);text-align:center;cursor:pointer;
  }
  .date-select select:focus{
    outline:none;border-color:var(--amber);background:#fff;
    box-shadow:0 0 0 3px rgba(198,138,46,.15);
  }

  .leave-types{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;}
  @media (max-width:480px){.leave-types{grid-template-columns:1fr;}}
  .leave-types input{position:absolute;opacity:0;}
  .leave-types label{
    margin:0;border:1px solid var(--line);border-radius:3px;
    padding:11px 8px;text-align:center;font-size:13.5px;font-weight:500;
    cursor:pointer;background:#FAF8F4;transition:.15s;
  }
  .leave-types input:checked + label{
    border-color:var(--amber);background:#F2E9D4;
    color:var(--amber-deep);font-weight:700;
  }

  .days-badge{
    display:inline-flex;align-items:center;gap:8px;
    background:#EFEBE1;border:1px solid var(--line);
    border-radius:3px;padding:9px 14px;font-size:14px;color:var(--muted);
  }
  .days-badge b{color:var(--ink);font-size:16px;font-family:'Tajawal',sans-serif;}

  .submit-row{
    margin-top:28px;padding-top:22px;border-top:1px solid var(--line);
  }
  button{
    width:100%;background:var(--ink);color:#fff;border:none;
    padding:14px 34px;font-size:15.5px;font-weight:700;
    border-radius:3px;cursor:pointer;font-family:inherit;
    transition:background .15s, transform .1s, opacity .15s;
  }
  button:hover{background:#1A130C;}
  button:active{transform:translateY(1px);}
  button:disabled{opacity:.5;cursor:not-allowed;}
  .note{font-size:12.5px;color:var(--muted);line-height:1.7;margin-top:12px;text-align:center;}

  .footer-note{text-align:center;margin-top:22px;font-size:12.5px;color:var(--muted);}
  ::placeholder{color:#A69F8D;}
</style>
</head>

      <h1>نموذج طلب إجازة</h1>
    </div>
  </div>

  <div class="card">
    <form id="leaveForm" action="https://script.google.com/macros/s/AKfycbwxDX3sXci4CvJpy_wO8KhCtEdnowLC36zolawQP1DFe0gDC0rNJdE_uTqbpLi9KQAW/exec" method="POST">
      <input type="hidden" name="_dept" value="health_safety">
      

      <div class="field code-row">
        <label>الكود الوظيفي<span class="req">*</span></label>
        <input type="text" id="codeInput" name="الكود" required inputmode="numeric" placeholder="اكتب الكود الوظيفي">
        <div class="code-status" id="codeStatus"></div>
      </div>

      <div class="row">
        <div class="field">
          <label>الاسم<span class="req">*</span></label>
          <input type="text" id="nameInput" name="الاسم" required readonly placeholder="يظهر تلقائيًا">
        </div>
        <div class="field">
          <label>القسم<span class="req">*</span></label>
          <input type="text" id="deptInput" name="القسم" required readonly placeholder="يظهر تلقائيًا">
        </div>
      </div>

      <div class="field">
        <label>نوع الإجازة<span class="req">*</span></label>
        <div class="leave-types">
          <input type="radio" id="t1" name="نوع الإجازة" value="سنوية" required><label for="t1">سنوية</label>
          <input type="radio" id="t2" name="نوع الإجازة" value="بدل راحة"><label for="t2">بدل راحة</label>
          <input type="radio" id="t3" name="نوع الإجازة" value="بدل عطلة رسمية"><label for="t3">بدل عطلة رسمية</label>
        </div>
      </div>

      <div class="field">
        <label>تاريخ بدء الإجازة<span class="req">*</span></label>
        <div class="date-select">
          <select id="startDay" required></select>
          <select id="startMonth" required></select>
          <select id="startYear" required></select>
        </div>
        <input type="hidden" id="startDate" name="تاريخ بدء الإجازة">
      </div>

      <div class="field">
        <label>تاريخ العودة<span class="req">*</span></label>
        <div class="date-select">
          <select id="endDay" required></select>
          <select id="endMonth" required></select>
          <select id="endYear" required></select>
        </div>
        <input type="hidden" id="endDate" name="تاريخ العودة">
      </div>

      <div class="field">
        <label>عدد الأيام<span class="req">*</span></label>
        <input type="text" id="daysInput" name="عدد الأيام" required inputmode="numeric" placeholder="مثال: 5">
      </div>

      <div class="field">
        <label>السبب <span class="opt">(اختياري)</span></label>
        <textarea name="السبب" placeholder="اذكر السبب إن رغبت..."></textarea>
      </div>

      <div class="submit-row">
        <button type="submit" id="submitBtn" disabled>إرسال الطلب</button>
        <p class="note">سيتم إرسال الطلب لجهة الاعتماد، ولن يصل للمستلم الرئيسي إلا بعد الموافقة.</p>

</div>

<script>
const EMPLOYEES = {"101": {"name": "بلال عطية عبد الحليم محمد", "dept": "الصحة والسلامة"}, "206": {"name": "محمد احمد محمد سعيد", "dept": "الصحة والسلامة"}, "278": {"name": "ياسر خليل ابراهيم محمد", "dept": "الصحة والسلامة"}, "347": {"name": "محمد شعبان عبد المنعم عرفات", "dept": "الصحة والسلامة"}, "356": {"name": "وسام يوسف حسين خليل", "dept": "الصحة والسلامة"}, "585": {"name": "جمال محمود محمد عبدالرحمن", "dept": "الصحة والسلامة"}, "946": {"name": "محمد مبروك ابراهيم محمد الرمسيسي", "dept": "الصحة والسلامة"}, "960": {"name": "وليد فوزي مصطفى شلبي", "dept": "الصحة والسلامة"}, "1052": {"name": "محمد محمود محمد الامام", "dept": "الصحة والسلامة"}, "1078": {"name": "شعبان ابراهيم السيد سالم", "dept": "الصحة والسلامة"}, "1171": {"name": "اسلام احمد يوسف محمد الزهيرى", "dept": "الصحة والسلامة"}, "1174": {"name": "اسلام عفيفى محمود عفيفى", "dept": "الصحة والسلامة"}, "1179": {"name": "ابراهيم عبد الفضيل ابراهيم عبد القادر", "dept": "الصحة والسلامة"}, "1194": {"name": "محمد صلاح سعد ابو المجد", "dept": "الصحة والسلامة"}, "1236": {"name": "عبد الحميد على عبد الحميد محمد", "dept": "الصحة والسلامة"}, "1257": {"name": "محمد شعبان عبدالخالق احمد", "dept": "الصحة والسلامة"}, "1258": {"name": "احمد منصور حامد محمود", "dept": "الصحة والسلامة"}, "1296": {"name": "محمد خالد نبيل على", "dept": "الصحة والسلامة"}, "1304": {"name": "احمد فتحى عبدالله نوبى", "dept": "الصحة والسلامة"}};
</script>
<script>
  const codeInput = document.getElementById('codeInput');
  const nameInput = document.getElementById('nameInput');
  const deptInput = document.getElementById('deptInput');
  const codeStatus = document.getElementById('codeStatus');
  const submitBtn = document.getElementById('submitBtn');

  let codeValid = false;

  function lookupCode(){
    const code = codeInput.value.trim();
    if(!code){
      nameInput.value=''; deptInput.value=''; codeStatus.textContent=''; codeStatus.className='code-status';
      codeValid=false; updateSubmit(); return;
    }
    const rec = EMPLOYEES[code];
    if(rec){
      nameInput.value = rec.name;
      deptInput.value = rec.dept;
      codeStatus.textContent = 'تم التعرف على الموظف';
      codeStatus.className = 'code-status ok';
      codeValid = true;
    } else {
      nameInput.value=''; deptInput.value='';
      codeStatus.textContent = 'الكود غير موجود، تحقق منه';
      codeStatus.className = 'code-status err';
      codeValid = false;
    }
    updateSubmit();
  }

  function updateSubmit(){
    submitBtn.disabled = !codeValid;
  }

  codeInput.addEventListener('input', lookupCode);
  codeInput.addEventListener('blur', lookupCode);

  // بناء قوائم التاريخ (يوم / شهر / سنة)
  const nowYear = new Date().getFullYear();

  function fillSelect(sel, count, offset, labels){
    let html = '<option value="" disabled selected></option>';
    for(let i=0;i<count;i++){
      const val = i+offset;
      const label = labels ? labels[i] : val;
      html += `<option value="${val}">${label}</option>`;
    }
    sel.innerHTML = html;
  }

  function setupDateGroup(dayId, monthId, yearId, hiddenId){
    const day = document.getElementById(dayId);
    const month = document.getElementById(monthId);
    const year = document.getElementById(yearId);
    const hidden = document.getElementById(hiddenId);

    fillSelect(day, 31, 1);
    fillSelect(month, 12, 1);
    fillSelect(year, 3, nowYear);

    function sync(){
      if(day.value && month.value && year.value){
        const d = String(day.value).padStart(2,'0');
        const m = String(month.value).padStart(2,'0');
        hidden.value = `${d}/${m}/${year.value}`;
      } else {
        hidden.value = '';
      }
    }
    day.addEventListener('change', sync);
    month.addEventListener('change', sync);
    year.addEventListener('change', sync);
  }

  setupDateGroup('startDay','startMonth','startYear','startDate');
  setupDateGroup('endDay','endMonth','endYear','endDate');
</script>
</body>
</html>
