<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>نموذج طلب إجازة - جميع الأقسام</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;900&family=IBM+Plex+Sans+Arabic:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#2B2118;
    --paper:#F5F3EF;
    --card:#FFFFFF;
    --line:#E1DBCD;
    --amber:#B99A5B;
    --amber-deep:#8A6D34;
    --sage:#3F4A5C;
    --danger:#9C3B2E;
    --muted:#6E6759;
    --ok:#3D6B4F;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--paper);
    font-family:'IBM Plex Sans Arabic','Tajawal',sans-serif;
    color:var(--ink);
    min-height:100vh;
    padding:32px 16px 64px;
  }
  .wrap{max-width:640px;margin:0 auto;}

  .stamp{display:flex;align-items:center;gap:14px;margin-bottom:28px;}
  .stamp-mark{
    width:56px;height:56px;border-radius:50%;
    border:2.5px solid var(--amber);
    display:flex;align-items:center;justify-content:center;
    background:#fff;
    overflow:hidden;
    flex-shrink:0;
  }
  .stamp-mark img{
    width:100%;height:100%;object-fit:contain;padding:6px;
  }
  .stamp-text .eyebrow{
    font-size:12px;letter-spacing:.12em;color:var(--muted);
    text-transform:uppercase;margin-bottom:2px;
  }
  h1{
    font-family:'Tajawal',sans-serif;font-weight:900;
    font-size:clamp(24px,4vw,30px);margin:0;color:var(--ink);
  }

  .card{
    background:var(--card);border:1px solid var(--line);border-radius:4px;
    padding:36px clamp(20px,4vw,44px);box-shadow:0 1px 0 var(--line);
    position:relative;
  }
  .card::before{
    content:"";position:absolute;top:0;right:0;left:0;height:5px;
    background:linear-gradient(90deg,var(--amber),var(--sage));
    border-radius:4px 4px 0 0;
  }

  .field{margin-bottom:18px;}
  label{display:block;font-size:14px;font-weight:600;margin:0 0 6px;color:var(--ink);}
  label .req{color:var(--danger);margin-left:3px;}
  label .opt{color:var(--muted);font-weight:400;font-size:12.5px;}

  input[type=text],input[type=date],select,textarea{
    width:100%;border:1px solid var(--line);background:#FAF8F4;
    border-radius:3px;padding:11px 13px;font-family:inherit;font-size:15px;
    color:var(--ink);transition:border-color .15s, background .15s;
  }
  input:focus,select:focus,textarea:focus{
    outline:none;border-color:var(--amber);background:#fff;
    box-shadow:0 0 0 3px rgba(198,138,46,.15);
  }
  textarea{resize:vertical;min-height:76px;}
  input:read-only{background:#EFEBE1;color:var(--muted);}

  .code-row{position:relative;}
  .code-status{
    font-size:12.5px;margin-top:6px;min-height:16px;
    display:flex;align-items:center;gap:6px;
  }
  .code-status.ok{color:var(--ok);font-weight:600;}
  .code-status.err{color:var(--danger);font-weight:600;}
  .dot{width:6px;height:6px;border-radius:50%;background:currentColor;flex-shrink:0;}

  .row{display:grid;grid-template-columns:1fr 1fr;gap:16px;}
  @media (max-width:520px){.row{grid-template-columns:1fr;}}

  .date-select{display:grid;grid-template-columns:1fr 1.4fr 1fr;gap:8px;}
  .date-select select{
    width:100%;border:1px solid var(--line);background:#FAF8F4;
    border-radius:3px;padding:11px 8px;font-family:inherit;font-size:14.5px;
    color:var(--ink);text-align:center;cursor:pointer;
  }
  .date-select select:focus{
    outline:none;border-color:var(--amber);background:#fff;
    box-shadow:0 0 0 3px rgba(198,138,46,.15);
  }

  .leave-types{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;}
  @media (max-width:480px){.leave-types{grid-template-columns:1fr;}}
  .leave-types input{position:absolute;opacity:0;}
  .leave-types label{
    margin:0;border:1px solid var(--line);border-radius:3px;
    padding:11px 8px;text-align:center;font-size:13.5px;font-weight:500;
    cursor:pointer;background:#FAF8F4;transition:.15s;
  }
  .leave-types input:checked + label{
    border-color:var(--amber);background:#F2E9D4;
    color:var(--amber-deep);font-weight:700;
  }

  .days-badge{
    display:inline-flex;align-items:center;gap:8px;
    background:#EFEBE1;border:1px solid var(--line);
    border-radius:3px;padding:9px 14px;font-size:14px;color:var(--muted);
  }
  .days-badge b{color:var(--ink);font-size:16px;font-family:'Tajawal',sans-serif;}

  .submit-row{
    margin-top:28px;padding-top:22px;border-top:1px solid var(--line);
  }
  button{
    width:100%;background:var(--ink);color:#fff;border:none;
    padding:14px 34px;font-size:15.5px;font-weight:700;
    border-radius:3px;cursor:pointer;font-family:inherit;
    transition:background .15s, transform .1s, opacity .15s;
  }
  button:hover{background:#1A130C;}
  button:active{transform:translateY(1px);}
  button:disabled{opacity:.5;cursor:not-allowed;}
  .note{font-size:12.5px;color:var(--muted);line-height:1.7;margin-top:12px;text-align:center;}

  .footer-note{text-align:center;margin-top:22px;font-size:12.5px;color:var(--muted);}
  ::placeholder{color:#A69F8D;}
</style>
</head>

<script>
  const deptSelect = document.getElementById('deptSelect');
  const deptHidden = document.getElementById('deptHidden');
  const codeInput = document.getElementById('codeInput');
  const nameInput = document.getElementById('nameInput');
  const deptInput = document.getElementById('deptInput');
  const codeStatus = document.getElementById('codeStatus');
  const submitBtn = document.getElementById('submitBtn');

  let codeValid = false;

  function resetEmployeeFields(){
    nameInput.value = '';
    deptInput.value = '';
    codeStatus.textContent = '';
    codeStatus.className = 'code-status';
    codeValid = false;
    updateSubmit();
  }

  deptSelect.addEventListener('change', function(){
    deptHidden.value = deptSelect.value;
    deptInput.value = deptSelect.options[deptSelect.selectedIndex].text;
    codeInput.value = '';
    codeInput.disabled = !deptSelect.value;
    codeInput.placeholder = deptSelect.value ? 'اكتب الكود الوظيفي' : 'اختر القسم أولاً ثم اكتب الكود الوظيفي';
    resetEmployeeFields();
    if(deptSelect.value){
      nameInput.placeholder = 'يظهر تلقائيًا';
    }
  });

  function lookupCode(){
    const dept = deptSelect.value;
    const code = codeInput.value.trim();
    if(!dept || !code){
      nameInput.value=''; codeStatus.textContent=''; codeStatus.className='code-status';
      codeValid=false; updateSubmit(); return;
    }
    const deptEmployees = EMPLOYEES[dept] || {};
    const empName = deptEmployees[code];
    if(empName){
      nameInput.value = empName;
      deptInput.value = deptSelect.options[deptSelect.selectedIndex].text;
      codeStatus.textContent = 'تم التعرف على الموظف';
      codeStatus.className = 'code-status ok';
      codeValid = true;
    } else {
      nameInput.value='';
      codeStatus.textContent = 'الكود غير موجود في هذا القسم، تحقق منه';
      codeStatus.className = 'code-status err';
      codeValid = false;
    }
    updateSubmit();
  }

  function updateSubmit(){
    submitBtn.disabled = !codeValid;
  }

  codeInput.addEventListener('input', lookupCode);
  codeInput.addEventListener('blur', lookupCode);

  // بناء قوائم التاريخ (يوم / شهر / سنة)
  const nowYear = new Date().getFullYear();

  function fillSelect(sel, count, offset, labels){
    let html = '<option value="" disabled selected></option>';
    for(let i=0;i<count;i++){
      const val = i+offset;
      const label = labels ? labels[i] : val;
      html += `<option value="${val}">${label}</option>`;
    }
    sel.innerHTML = html;
  }

  function setupDateGroup(dayId, monthId, yearId, hiddenId){
    const day = document.getElementById(dayId);
    const month = document.getElementById(monthId);
    const year = document.getElementById(yearId);
    const hidden = document.getElementById(hiddenId);

    fillSelect(day, 31, 1);
    fillSelect(month, 12, 1);
    fillSelect(year, 3, nowYear);

    function sync(){
      if(day.value && month.value && year.value){
        const d = String(day.value).padStart(2,'0');
        const m = String(month.value).padStart(2,'0');
        hidden.value = `${d}/${m}/${year.value}`;
      } else {
        hidden.value = '';
      }
    }
    day.addEventListener('change', sync);
    month.addEventListener('change', sync);
    year.addEventListener('change', sync);
  }

  setupDateGroup('startDay','startMonth','startYear','startDate');
  setupDateGroup('endDay','endMonth','endYear','endDate');
</script>
